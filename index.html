<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fusemass</title>
        <style>
            /* Inline splash so the window shows immediate, branded feedback
               while the renderer's module graph loads (notably slow on a cold
               dev server). It paints from the initial HTML — no JS or app
               bundle required — then is faded out by the renderer once React
               mounts (see src/renderer.tsx). The background matches the
               window's backgroundColor (#fff) so there's no flash. */
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffffff;
                z-index: 9999;
                transition: opacity 200ms ease;
            }
            #splash.is-hiding {
                opacity: 0;
                pointer-events: none;
            }
            /* Grayed app icon that gently pulses while the app loads. The src is
               an inlined data URI (a small, desaturated copy of the rounded app
               icon) injected by scripts/generate-icons.mjs, so it paints from the
               initial HTML with no extra request and stays in sync with the
               icon. */
            #splash .splash-icon {
                width: 84px;
                height: 84px;
                animation: splash-pulse 1.4s ease-in-out infinite;
            }
            @keyframes splash-pulse {
                0%,
                100% {
                    opacity: 0.72;
                    transform: scale(0.95);
                }
                50% {
                    opacity: 0.85;
                    transform: scale(1);
                }
            }
        </style>
    </head>
